[project]
name = "dietary-advisor"
version = "0.0.0"
description = "Integration of Large Language Models with knowledge-based dietary recommendation systems. Master's Thesis project."
authors = [{ name = "Piotr Karaś", email = "pkaras@student.agh.edu.pl" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "chromadb>=1.5.8",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "logfire>=4.32.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "pulp>=3.3.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.84.1",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.10.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "copier>=9.11.3,<10",
    "fawltydeps>=0.20.0,<1.0.0",
    "ipython>=9.9.0,<10",
    "mypy>=1.19.1,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest>=9.0.2,<10",
    "ruff>=0.14.14,<0.15.0",
    "pytest-asyncio>=1.3.0,<2",
    "dotenv-linter>=0.7.0,<1",
    "pytest-env>=1.2.0,<2",
    "python-dotenv>=1.2.1,<2",
]

[project.scripts]
dietary-advisor = "dietary_advisor.cli:app"

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
#  See https://docs.astral.sh/ruff/rules/ for more information.
select = [
    "PT",   # flake8-pytest-style
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "I",    # isort
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "N",    # pep8-naming
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    ]
ignore = ["S101", "A003", "B904", "N818", "COM812"]

[tool.ruff.lint.per-file-ignores]
# typer encourages using `typer.Option`/`typer.Argument` as default arguments,
# which conflicts with B008 ("function call in default argument").
"dietary_advisor/cli.py" = ["B008"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true

[tool.ruff.lint.isort]
order-by-type = false
known-first-party = ["dietary_advisor"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError()",
]

[tool.fawltydeps]
code = ["dietary_advisor", "evaluation"]
deps = ["pyproject.toml"]
# Treat the project root as the base directory so that BOTH `dietary_advisor`
# and `evaluation` are recognised as 1st-party packages (otherwise fawltydeps
# deduces a separate base-dir per `code` entry and cross-imports between the
# two top-level packages get flagged as undeclared third-party imports).
base_dir = "."
ignore_unused = [
    # Dev dependencies. This list should contain ALL of them!
    "copier",
    "fawltydeps",
    "ipython",
    "mypy",
    "pytest-cov",
    "pytest-mock",
    "pytest",
    "ruff",
    "pytest-asyncio",
    "dotenv-linter",
    "pytest-env",
    "python-dotenv",
    # Runtime dep used transitively (e.g. instrumented by pydantic-ai), no direct import in our code.
    "logfire",
]

# The `pydantic_ai` import is physically provided by the `pydantic-ai-slim` wheel,
# which `pydantic-ai` depends on and re-exports. Tell fawltydeps about this mapping
# explicitly so the import resolves to our declared `pydantic-ai` dep.
[tool.fawltydeps.custom_mapping]
pydantic-ai = ["pydantic_ai"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = "misc"

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = "tests"
addopts = "--strict-markers -p no:warnings --cov=dietary_advisor --cov-fail-under=60"
asyncio_mode = "auto"

[tool.pytest_env]
FLAVOR = "test"
DEBUG = "True"
SERVICE_NAME = "dietary-advisor"

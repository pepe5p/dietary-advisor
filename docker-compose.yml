x-dietary-advisor: &dietary-advisor-config
  image: dietaryadvisor-dev
  pull_policy: never
  env_file:
    - path: .env
      required: false
  working_dir: /code
  volumes:
    # Bind the project root so source edits, .data/, evaluation/reports/ and
    # the downloaded corpus PDFs are visible from the host without rebuilds.
    - "./:/code/"
    # Anonymous volume that masks the host's macOS .venv with the
    # container's Linux venv built during `docker compose build`.
    - "/code/.venv"


services:
  # Single-service CLI runner. Use it via:
  #   docker compose run --rm dietary_advisor <cmd>
  # or via the convenience wrappers in the justfile (`just dc <recipe>`).
  # No `ports` block by default; add one in docker-compose.override.yml if
  # you ever want to expose a server port.
  dietary_advisor:
    <<: *dietary-advisor-config
    build:
      context: ./
      args:
        - BUILD_COMMIT_SHA=localdev
    command: ["dietary-advisor", "--help"]
